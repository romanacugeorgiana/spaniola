<div class="wrap">
  <p class="eyebrow">Timpul 2 din 5 · los 100 verbos más usados</p>
  <h1>Pretérito <em>imperfecto</em></h1>
  <p class="lede">100 de fraze. Morfologia e simplă — doar trei verbe neregulate — deci dificultatea reală e la accente (<strong>-ábamos</strong>, <strong>-ía</strong>) și la ultima categorie, unde tu decizi între imperfecto și indefinido.</p>

  <div class="tiles" id="tiles"></div>

  </div>

      <button class="primary" id="btnRedo">Reia doar greșelile</button>
      <button class="ghost" id="btnRestart">Începe de la capăt</button>
    </div>
  </div>

<script>

{c:"verbos en -ar",s:"Mi padre ___ en una fábrica de coches.",v:"trabajar",a:["trabajaba"],e:"Terminații -ar: aba, abas, aba, ábamos, abais, aban."},

{c:"verbos en -ar",s:"En aquella época ella ___ el metro para ir al trabajo.",v:"tomar",a:["tomaba"],e:"en aquella época e o marcă tipică de imperfect."},
{c:"verbos en -ar",s:"Los domingos nosotros ___ el día entero en el campo.",v:"pasar",a:["pasábamos"],e:"pasábamos, cu accent pe a."},

{c:"verbos en -ar",s:"Antes la gente ___ el pan cada mañana.",v:"comprar",a:["compraba"],e:"Obicei din trecut, fără limită precisă → imperfect."},

/* -ER / -IR */
{c:"verbos en -er, -ir",s:"Cuando ___ veinte años, vivía en Barcelona.",v:"tener, yo",a:["tenía"],e:"Terminații -er / -ir: ía, ías, ía, íamos, íais, ían. Toate poartă accent."},

{c:"verbos en -er, -ir",s:"Antes ___ una farmacia en esta esquina.",v:"haber",a:["había"],e:"Forma impersonală la imperfect e había, invariabilă: había una farmacia, había tres bares."},

{c:"ser, ir, ver",s:"Cuando yo ___ pequeña, tenía el pelo rizado.",v:"ser",a:["era"],e:"ser: era, eras, era, éramos, erais, eran."},

{c:"ser, ir, ver",s:"Antes ella ___ profesora de instituto.",v:"ser",a:["era"],e:"Profesie în trecut, ca stare de durată → era."},

{c:"imperfecto o indefinido",s:"Mientras ella ___, nadie se atrevía a interrumpir.",v:"hablar",a:["hablaba"],e:"Două acțiuni paralele în desfășurare → imperfect."},
{c:"imperfecto o indefinido",s:"De repente ___ todas las luces del edificio.",v:"apagarse",a:["se apagaron"],e:"de repente marchează ruptura, acțiune punctuală → indefinido."},
{c:"imperfecto o indefinido",s:"Cuando era estudiante, ___ con tres compañeros.",v:"vivir, yo",a:["vivía"],e:"Situație de durată, fără limite precise → imperfect."},
{c:"imperfecto o indefinido",s:"El lunes pasado ___ el vuelo por diez minutos.",v:"perder, nosotros",a:["perdimos"],e:"el lunes pasado + fapt punctual → indefinido."},
{c:"imperfecto o indefinido",s:"Siempre que ___, nos llamaba por teléfono.",v:"poder, él",a:["podía"],e:"siempre que = repetiție → imperfect, în acord cu llamaba."},
{c:"imperfecto o indefinido",s:"Aquel día ___ un frío insoportable.",v:"hacer",a:["hacía"],e:"Vremea ca decor al povestirii → imperfect, chiar dacă ziua e precizată."},
{c:"imperfecto o indefinido",s:"Mi madre ___ en un pueblo de Cáceres, en 1954.",v:"nacer",a:["nació"],e:"Datele biografice cer indefinido: nació."},
{c:"imperfecto o indefinido",s:"Los niños ___ en el patio cuando empezó a llover.",v:"jugar",a:["jugaban"],e:"Acțiunea-cadru întreruptă → imperfect."},
{c:"imperfecto o indefinido",s:"¿Cuántos años ___ cuando te mudaste a Madrid?",v:"tener, tú",a:["tenías"],e:"Vârsta ca stare la un moment din trecut → imperfect."},
{c:"imperfecto o indefinido",s:"Ayer ___ toda la tarde en la biblioteca.",v:"estar, yo",a:["estuve"],e:"Perioadă delimitată și încheiată → indefinido: estuve."},
{c:"imperfecto o indefinido",s:"Antes esta calle ___ de otra manera.",v:"llamarse",a:["se llamaba"],e:"antes + situație de durată → imperfect."},
{c:"imperfecto o indefinido",s:"El accidente ___ a las siete de la mañana.",v:"ocurrir",a:["ocurrió"],e:"Eveniment punctual, cu oră precisă → indefinido."},
{c:"imperfecto o indefinido",s:"Mientras nosotros ___, alguien entró en casa.",v:"dormir",a:["dormíamos"],e:"mientras + imperfect: dormíamos, fără o → u."},
{c:"imperfecto o indefinido",s:"La semana pasada ___ a tu hermana en una cena.",v:"conocer, yo",a:["conocí"],e:"La indefinido, conocer înseamnă „a face cunoștință”. La imperfect ar însemna „o știam deja”."},
{c:"imperfecto o indefinido",s:"Nadie ___ qué hacer en aquel momento.",v:"saber",a:["sabía"],e:"Stare mentală de fundal → imperfect."},
{c:"imperfecto o indefinido",s:"Cuando terminó la carrera, ___ a vivir a Londres.",v:"irse, ella",a:["se fue"],e:"Două acțiuni punctuale succesive → indefinido: se fue."},
{c:"imperfecto o indefinido",s:"En aquel entonces no ___ tantos coches en la ciudad.",v:"haber",a:["había"],e:"Descrierea unei epoci → había, forma impersonală."},
{c:"imperfecto o indefinido",s:"Le ___ las gracias y me marché sin decir nada más.",v:"dar, yo",a:["di"],e:"Acțiune punctuală → indefinido: di, fără accent grafic."}
];
const CATS=[{id:"todos",label:"toate (100)"},{id:"verbos en -ar",label:"verbos en -ar"},{id:"verbos en -er, -ir",label:"-er / -ir"},{id:"ser, ir, ver",label:"ser, ir, ver"},{id:"usos y perífrasis",label:"usos y perífrasis"},{id:"imperfecto o indefinido",label:"imperfecto o indefinido"}];
const ACCENTS=["á","é","í","ó","ú","ñ","ü","¿","¡"];
let deck=[],idx=0,checked=false,correct=0,missed=[],cat="todos",shuffled=false;
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().trim().replace(/\s+/g," ").normalize("NFD").replace(/[\u0300-\u0302\u0304-\u036f]/g,"").replace(/\u0303/g,"~").normalize("NFC");
function pool(){const l=cat==="todos"?ITEMS.slice():ITEMS.filter(i=>i.c===cat);if(shuffled)for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]];}return l;}
function buildChips(){const c=$("chips");c.innerHTML="";CATS.forEach(k=>{const b=document.createElement("button");b.textContent=k.label;b.type="button";b.setAttribute("aria-pressed",String(k.id===cat));b.addEventListener("click",()=>{cat=k.id;buildChips();start(pool());});c.appendChild(b);});const s=document.createElement("button");s.type="button";s.className="shuffle";s.textContent=shuffled?"ordine amestecată":"amestecă ordinea";s.addEventListener("click",()=>{shuffled=!shuffled;buildChips();start(pool());});c.appendChild(s);}
function buildAccents(){$("accents").innerHTML="";ACCENTS.forEach(ch=>{const b=document.createElement("button");b.textContent=ch;b.type="button";b.addEventListener("click",()=>{const i=document.querySelector("input.gap");if(!i||i.disabled)return;const p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+ch+i.value.slice(i.selectionEnd??p);i.focus();i.setSelectionRange(p+1,p+1);});$("accents").appendChild(b);});}
function drawTiles(){const t=$("tiles");t.innerHTML="";deck.forEach((it,i)=>{const d=document.createElement("div");d.className="tile"+(it.res==="ok"?" ok":it.res==="no"?" no":"")+(i===idx?" now":"");t.appendChild(d);});}
function render(){if(idx>=deck.length)return finish();const it=deck[idx];checked=false;
$("counter").textContent=`Fraza ${idx+1} / ${deck.length}`;$("tag").textContent=it.c;
const parts=it.s.split("___");const p=$("sentence");p.innerHTML="";p.append(document.createTextNode(parts[0]));
const inp=document.createElement("input");inp.className="gap";inp.type="text";inp.autocomplete="off";inp.spellcheck=false;inp.setAttribute("aria-label","forma verbului");p.append(inp);
const cue=document.createElement("span");cue.className="cue";cue.textContent="("+it.v+")";p.append(document.createTextNode(" "));p.append(cue);p.append(document.createTextNode(parts[1]||""));
$("fb").className="fb";$("btnCheck").textContent="Verifică";$("btnShow").style.display="inline-block";
$("scoreL").textContent=`Corecte: ${correct}`;$("scoreR").textContent=`Greșite: ${missed.length}`;drawTiles();inp.focus();}
function check(reveal){const it=deck[idx],inp=document.querySelector("input.gap");if(!inp)return;const val=inp.value;
if(!reveal&&!val.trim()){inp.focus();return;}
const ok=!reveal&&it.a.some(x=>norm(x)===norm(val));
const exact=!reveal&&it.a.some(x=>x.toLowerCase()===val.toLowerCase().trim().replace(/\s+/g," "));
inp.disabled=true;inp.classList.add(ok?"good":"bad");if(reveal)inp.value="—";
it.res=ok?"ok":"no";if(ok)correct++;else missed.push(it);
$("fb").className="fb show "+(ok?"good":"bad");
$("verdict").textContent=ok?(exact?"Corect":"Corect — atenție la accent"):(reveal?"Răspunsul":"Greșit");
$("sol").innerHTML="→ <b>"+it.a.join(" / ")+"</b>";$("why").innerHTML=it.e;
$("btnCheck").textContent=(idx===deck.length-1)?"Vezi rezultatul":"Următoarea";$("btnShow").style.display="none";
$("scoreL").textContent=`Corecte: ${correct}`;$("scoreR").textContent=`Greșite: ${missed.length}`;checked=true;drawTiles();$("btnCheck").focus();}
function finish(){$("card").style.display="none";$("end").classList.add("show");
const pct=Math.round(correct/deck.length*100);$("finalScore").textContent=`${correct}/${deck.length}`;
$("finalMsg").textContent=pct>=90?"Imperfectul e stăpânit. Trece la indefinido.":pct>=70?"Bine. Verifică unde ai pierdut accentele.":"Reia mai ales categoria imperfecto o indefinido.";
const ul=$("missed");ul.innerHTML="";if(!missed.length)ul.innerHTML="<li>Nicio greșeală.</li>";
missed.forEach(m=>{const li=document.createElement("li");li.innerHTML=`<span class="m-s">${m.s.replace("___","______")} (${m.v})</span><br><span class="m-a">${m.a.join(" / ")}</span>`;ul.appendChild(li);});
$("btnRedo").style.display=missed.length?"inline-block":"none";drawTiles();}
function start(list){deck=list.map(o=>({...o,res:null}));idx=0;correct=0;missed=[];$("card").style.display="block";$("end").classList.remove("show");render();}
$("btnCheck").addEventListener("click",()=>{checked?(idx++,render()):check(false);});
$("btnShow").addEventListener("click",()=>check(true));
$("btnRedo").addEventListener("click",()=>start(missed.slice()));
$("btnRestart").addEventListener("click",()=>start(pool()));
document.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();checked?(idx++,render()):check(false);}});
buildChips();buildAccents();start(pool());
</script>
